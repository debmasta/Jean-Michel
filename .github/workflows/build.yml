name: build firmware
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prerequisites
        run: pip install Pillow
      - name: JieLi toolchain
        run: sh tools/get_toolchain.sh "$HOME/.jieli"
      - name: JieLi AC79 SDK
        run: git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"
      - name: Build
        env:
          FELUCCA_CDC: "0"
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clipper-debmaster-fwsc
          path: build/felucca.fwsc
      - name: Symbol sizes
        run: |
          "$HOME/.jieli/toolchain/common/bin/objdump" -t build/felucca.elf > build/syms.txt
          ls build/*.o build/*.elf > build/files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: symbols
          path: |
            build/syms.txt
            build/files.txt
