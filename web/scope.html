<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FM-1 · ÉCRAN 2</title>
<style>
  /* Jean-Michel: the second screen. Neon meters of the FM-1's sound (its USB audio in), for a second monitor, full screen */
  :root { --bg: #03050c; --ink: #e8f0ff; --dim: #5a73a0; --line: #1a2550; --o: #ff9a1f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.2 ui-monospace, Menlo, monospace; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  .bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 6px; align-items: center; padding: 8px 10px;
         background: linear-gradient(#03050cee, #03050c00); transition: opacity .4s; z-index: 2; flex-wrap: wrap; }
  body.idle .bar { opacity: 0; }
  .bar b { letter-spacing: 2px; margin-right: 8px; }
  button, select { background: #0a1230; color: var(--ink); border: 1px solid var(--line); padding: 6px 10px; font: inherit; cursor: pointer; }
  button.on { background: var(--o); color: #000; border-color: var(--o); }
  .sp { flex: 1; }
  #msg { color: var(--dim); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="bar">
  <b>ÉCRAN 2</b>
  <button data-m="0">1 ONDES</button><button data-m="1">2 SCOPE</button><button data-m="2">3 FILTRE</button><button data-m="3">4 MULTIBAND</button>
  <button id="auto">AUTO</button>
  <span class="sp"></span>
  <span id="msg"></span>
  <select id="src"></select>
  <button id="fs">PLEIN ÉCRAN</button>
</div>
<script>
"use strict";
/* sources: an audio input (the FM-1 over USB, or the sound card it goes into), or DEMO (a little synth, to see it without the FM-1).
 * Modes: ONDES (the sound and its three bands as glowing lanes), SCOPE (a mirrored neon waveform), FILTRE (the spectrum and the
 * filter of the page open in the editor), MULTIBAND (three bands with crossovers to drag, a meter and a scope each).
 * Keys: 1-4 the modes, A auto, F full screen. The editor (button ÉCRAN 2) sends its pages' knobs here (postMessage). */
const $ = (id) => document.getElementById(id);
const cv = $("cv"), g = cv.getContext("2d");
const S = { mode: +(localStorage.getItem("jmScopeMode") || 0), auto: false, autoT: 0, x: [180, 2200], drag: -1, pages: {}, hist: [[], [], [], []] };
const COLS = ["#2f7bff", "#ff2fb8", "#ffb31f", "#22e6ff"], BAND = ["#ff2f6a", "#ffd21f", "#22e6ff"];
let ac, src, an, bands = [], low = [], cross = [], demo = null, stream = null;

function audio() {
  if (ac) return;
  ac = new AudioContext();
  an = ac.createAnalyser(); an.fftSize = 4096; an.smoothingTimeConstant = 0.72;
  /* the bands: Linkwitz-Riley (two Butterworth in a row) at the two crossovers */
  const mk = (type, f) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = Math.SQRT1_2; return b; };
  const lp1a = mk("lowpass", S.x[0]), lp1b = mk("lowpass", S.x[0]), hp1a = mk("highpass", S.x[0]), hp1b = mk("highpass", S.x[0]);
  const lp2a = mk("lowpass", S.x[1]), lp2b = mk("lowpass", S.x[1]), hp2a = mk("highpass", S.x[1]), hp2b = mk("highpass", S.x[1]);
  cross = [[lp1a, lp1b, hp1a, hp1b], [lp2a, lp2b, hp2a, hp2b]];
  bands = [0, 1, 2].map(() => { const a = ac.createAnalyser(); a.fftSize = 2048; return a; });
  low = { in: ac.createGain() };
  low.in.connect(an);
  low.in.connect(lp1a); lp1a.connect(lp1b); lp1b.connect(bands[0]);
  low.in.connect(hp1a); hp1a.connect(hp1b); hp1b.connect(lp2a); lp2a.connect(lp2b); lp2b.connect(bands[1]);
  low.in.connect(hp2a); hp2a.connect(hp2b); hp2b.connect(bands[2]);
}
function setCross() { if (!cross.length) return; cross.forEach((fs, i) => fs.forEach((f) => f.frequency.setTargetAtTime(S.x[i], ac.currentTime, 0.02))); }
async function listInputs() {
  const sel = $("src"), keep = sel.value || localStorage.getItem("jmScopeSrc") || "demo";
  let devs = [];
  try { devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput"); } catch (e) {}
  sel.replaceChildren(new Option("DEMO", "demo"), ...devs.map((d, i) => new Option(d.label || `entrée ${i + 1}`, d.deviceId)));
  const fm1 = devs.find((d) => /fm-?1|m-vave|clipper|felucca/i.test(d.label));
  sel.value = [...sel.options].some((o) => o.value === keep) ? keep : fm1 ? fm1.deviceId : "demo";
}
async function useSource(id) {
  audio(); await ac.resume();
  if (src) { try { src.disconnect(); } catch (e) {} src = null; }
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  if (demo) { demo.stop(); demo = null; }
  localStorage.setItem("jmScopeSrc", id);
  if (id === "demo") { demo = demoSynth(); src = demo.out; src.connect(low.in); $("msg").textContent = "démo (choisis l'entrée du FM-1 à droite)"; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: { exact: id }, echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    src = ac.createMediaStreamSource(stream); src.connect(low.in);
    $("msg").textContent = "";
    if (!$("src").selectedOptions[0].text.startsWith("entrée")) return;
    await listInputs(); $("src").value = id;           /* (the names come once the input is allowed) */
  } catch (e) { $("msg").textContent = "entrée refusée"; }
}
function demoSynth() {                               /* a bass, hats and a chord, so every band moves */
  const out = ac.createGain(); out.gain.value = 0.5;
  const nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const dr = [55, 82.4, 110.3].map((f) => { const o = ac.createOscillator(), l = ac.createBiquadFilter(), v = ac.createGain();   /* a drone under it */
    o.type = "sawtooth"; o.frequency.value = f; l.type = "lowpass"; l.frequency.value = 900; v.gain.value = 0.07; o.connect(l); l.connect(v); v.connect(out); o.start(); return o; });
  let step = 0, t = ac.currentTime + 0.05;
  const notes = [36, 36, 48, 36, 39, 36, 43, 41];
  const tick = setInterval(() => {
    while (t < ac.currentTime + 0.2) {
      const o = ac.createOscillator(), f = ac.createBiquadFilter(), v = ac.createGain();
      o.type = "sawtooth"; o.frequency.value = 440 * 2 ** ((notes[step % 8] - 69) / 12);
      f.type = "lowpass"; f.Q.value = 9; f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(140, t + 0.18);
      v.gain.setValueAtTime(0.8, t); v.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.connect(f); f.connect(v); v.connect(out); o.start(t); o.stop(t + 0.22);
      if (step % 2) { const n = ac.createBufferSource(), h = ac.createBiquadFilter(), hv = ac.createGain(); n.buffer = nb; h.type = "highpass"; h.frequency.value = 7000;
        hv.gain.setValueAtTime(0.5, t); hv.gain.exponentialRampToValueAtTime(0.001, t + 0.05); n.connect(h); h.connect(hv); hv.connect(out); n.start(t, Math.random() * 0.5); n.stop(t + 0.06); }
      if (step % 8 === 0) for (const m of [60, 63, 67]) { const c = ac.createOscillator(), cv2 = ac.createGain(); c.type = "triangle"; c.frequency.value = 440 * 2 ** ((m - 69) / 12);
        cv2.gain.setValueAtTime(0.0001, t); cv2.gain.exponentialRampToValueAtTime(0.12, t + 0.1); cv2.gain.exponentialRampToValueAtTime(0.001, t + 1.1); c.connect(cv2); cv2.connect(out); c.start(t); c.stop(t + 1.2); }
      step++; t += 0.125;
    }
  }, 50);
  return { out, stop() { clearInterval(tick); dr.forEach((o) => o.stop()); out.disconnect(); } };
}

/* ---- drawing */
const buf = new Float32Array(4096), fbuf = new Float32Array(2048), bb = new Float32Array(2048);
const rms = (a, n = a.length) => { let s = 0; for (let i = 0; i < n; i++) s += a[i] * a[i]; return Math.sqrt(s / n); };
const fx = (f, W) => (Math.log(f / 20) / Math.log(20000 / 20)) * W, xf = (x, W) => 20 * (20000 / 20) ** (x / W);
function glow(pts, col, w, dpr, close) {
  g.lineJoin = g.lineCap = "round";
  for (const [lw, a, b] of [[w * 5, 0.16, 18], [w * 2, 0.45, 8], [w, 1, 0]]) {
    g.globalAlpha = a; g.lineWidth = lw * dpr; g.shadowBlur = b * dpr; g.shadowColor = typeof col === "string" ? col : "#fff"; g.strokeStyle = col;
    g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); if (close) g.closePath(); g.stroke();
  }
  g.globalAlpha = 1; g.shadowBlur = 0;
}
function grad(x0, x1, cols) { const q = g.createLinearGradient(x0, 0, x1, 0); cols.forEach((c, i) => q.addColorStop(i / (cols.length - 1), c)); return q; }
function mirrorBars(x0, y, W, h, vals, col, dpr) {   /* glowing mirrored bars, the newest on the right */
  const n = vals.length, bw = Math.max(1, W / n);
  g.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const a = Math.min(1, vals[i]) * h, x = x0 + i * bw;
    g.globalAlpha = 0.22; g.shadowBlur = 14 * dpr; g.shadowColor = "#fff"; g.fillRect(x - bw * 0.3, y - a * 1.1, bw * 1.2, a * 2.2);
    g.globalAlpha = 0.95; g.shadowBlur = 0; g.fillRect(x + bw * 0.2, y - a, Math.max(1, bw * 0.55), a * 2);
  }
  g.globalAlpha = 1;
}
function label(t, x, y, col, dpr, size = 12) { g.fillStyle = col; g.font = `${size * dpr}px ui-monospace, Menlo, monospace`; g.fillText(t, x, y); }
function filterPage() {                              /* the filter the editor shows: FILTER, LAYER 2 (FILT), else none */
  for (const k of ["FILTER", "LAYER 2"]) if (S.pages[k]) return S.pages[k];
  return null;
}
function frame() {
  requestAnimationFrame(frame);
  const dpr = Math.min(2, devicePixelRatio || 1), W = Math.round(innerWidth * dpr), H = Math.round(innerHeight * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  if (S.auto && performance.now() - S.autoT > 9000) { S.autoT = performance.now(); setMode((S.mode + 1) % 4); }
  const bgq = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * 0.7);
  bgq.addColorStop(0, "#0b1238"); bgq.addColorStop(1, "#02030a");
  g.globalCompositeOperation = "source-over"; g.fillStyle = bgq; g.fillRect(0, 0, W, H);
  if (!an) { label("clique n'importe où pour démarrer le son", W * 0.5 - 200 * dpr, H / 2, "#5a73a0", dpr, 16); return; }
  an.getFloatTimeDomainData(buf);
  const lv = [rms(buf)].concat(bands.map((b) => (b.getFloatTimeDomainData(bb), rms(bb))));
  S.hist.forEach((h, i) => { h.push(lv[i]); if (h.length > 260) h.shift(); });
  g.globalCompositeOperation = "lighter";
  [ondes, scope, filtre, multiband][S.mode](W, H, dpr, lv);
  g.globalCompositeOperation = "source-over";
}
function ondes(W, H, dpr) {                          /* four lanes: the sound, then LOW MID HIGH, scrolling like a recorder */
  const names = ["FM-1", "LOW", "MID", "HIGH"], cols = [grad(0, W, COLS.slice(0, 3)), BAND[0], BAND[1], BAND[2]];
  for (let k = 0; k < 4; k++) {
    const y = H * (0.2 + k * 0.2), h = H * (k ? 0.07 : 0.11), gain = k ? 7 : 4;
    mirrorBars(W * 0.08, y, W * 0.84, h, S.hist[k].map((v) => v * gain), cols[k], dpr);
    g.globalAlpha = 0.5; g.fillStyle = typeof cols[k] === "string" ? cols[k] : "#fff"; g.fillRect(W * 0.08, y - dpr * 0.5, W * 0.84, dpr); g.globalAlpha = 1;
    label(names[k], W * 0.02, y + 5 * dpr, k ? BAND[k - 1] : "#e8f0ff", dpr, 14);
  }
}
function scope(W, H, dpr, lv) {                      /* the waveform itself, mirrored, with a glow that breathes with the level */
  let z = 0; for (let i = 1; i < 2048; i++) if (buf[i - 1] < 0 && buf[i] >= 0) { z = i; break; }
  let pk = 0; for (let i = 0; i < 2048; i++) pk = Math.max(pk, Math.abs(buf[i]));
  S.pk = Math.max(pk, (S.pk || 0.05) * 0.97, 0.02);   /* (auto gain: a quiet sound still fills the screen) */
  const n = 1400, pts = [], m = H / 2, A = H * 0.36 * 0.6 / S.pk;
  for (let i = 0; i < n; i++) pts.push([W * 0.04 + (i / n) * W * 0.92, m - buf[z + i] * A * 1.6]);
  const vals = []; for (let i = 0; i < 180; i++) { let a = 0; for (let j = 0; j < 8; j++) a = Math.max(a, Math.abs(buf[z + i * 8 + j] || 0)); vals.push(a / S.pk); }
  mirrorBars(W * 0.04, m, W * 0.92, H * 0.3, vals, grad(0, W, ["#2f7bff", "#ff2fb8", "#ffb31f"]), dpr);
  glow(pts, "#ffffff", 1.2 + lv[0] * 6, dpr);
}
function filtre(W, H, dpr) {                         /* the spectrum, and the filter of the editor's page over it */
  an.getFloatFrequencyData(fbuf);
  const ny = ac.sampleRate / 2, base = H * 0.86, top = H * 0.12, nb = 160, cols = grad(0, W, ["#22e6ff", "#7b5cff", "#ff4fd8", "#ffb31f"]);
  g.fillStyle = cols;
  for (let i = 0; i < nb; i++) {
    const f0 = xf((i / nb) * W, W), f1 = xf(((i + 1) / nb) * W, W);
    let a = -140; for (let k = Math.floor(f0 / ny * 2048); k <= Math.min(2047, Math.ceil(f1 / ny * 2048)); k++) a = Math.max(a, fbuf[k]);
    const h = Math.max(0, (a + 100) / 85) * (base - top), x = (i / nb) * W;
    g.globalAlpha = 0.25; g.shadowBlur = 16 * dpr; g.shadowColor = "#fff"; g.fillRect(x, base - h, W / nb * 0.9, h);
    g.globalAlpha = 0.9; g.shadowBlur = 0; g.fillRect(x + W / nb * 0.15, base - h, W / nb * 0.55, h);
  }
  g.globalAlpha = 1;
  for (const f of [50, 100, 200, 500, 1000, 2000, 5000, 10000]) { const x = fx(f, W); g.fillStyle = "#1a2550"; g.fillRect(x, top, dpr, base - top); label(f >= 1000 ? f / 1000 + "k" : String(f), x + 4 * dpr, base + 18 * dpr, "#5a73a0", dpr); }
  const p = filterPage();
  if (p) {                                           /* cutoff and resonance, 0..1 from the editor's knobs */
    const fc = 20 * 1000 ** (p.cut ?? 0.6), q = 0.5 + (p.res ?? 0.2) * 12, pts = [];
    for (let x = 0; x <= W; x += 3 * dpr) { const r = xf(x, W) / fc, mag = 1 / Math.sqrt((1 - r * r) ** 2 + (r / q) ** 2);
      pts.push([x, base - Math.max(0, Math.min(1.25, (20 * Math.log10(mag) + 48) / 64)) * (base - top)]); }
    glow(pts, "#ffffff", 2.2, dpr);
    label(`${p.title}  ${Math.round(fc)} Hz`, fx(fc, W) + 8 * dpr, top + 20 * dpr, "#ff9a1f", dpr, 15);
  } else label("ouvre une page FILTER dans l'éditeur pour voir sa courbe ici", W * 0.04, top + 4 * dpr, "#5a73a0", dpr, 13);
}
function multiband(W, H, dpr, lv) {                  /* three bands: the spectrum coloured by band, crossovers to drag, a meter and a scope each */
  an.getFloatFrequencyData(fbuf);
  const ny = ac.sampleRate / 2, base = H * 0.5, top = H * 0.1, nb = 200;
  for (let i = 0; i < nb; i++) {
    const x = (i / nb) * W, f = xf(x, W), k = Math.min(2047, Math.round(f / ny * 2048)), band = f < S.x[0] ? 0 : f < S.x[1] ? 1 : 2;
    const h = Math.max(0, (fbuf[k] + 100) / 85) * (base - top);
    g.fillStyle = BAND[band]; g.globalAlpha = 0.25; g.shadowBlur = 12 * dpr; g.shadowColor = BAND[band]; g.fillRect(x, base - h, W / nb, h);
    g.globalAlpha = 0.85; g.shadowBlur = 0; g.fillRect(x + W / nb * 0.2, base - h, W / nb * 0.5, h);
  }
  g.globalAlpha = 1;
  S.x.forEach((f, i) => { const x = fx(f, W);                     /* the crossovers */
    glow([[x, top - 10 * dpr], [x, base]], S.drag === i ? "#ff9a1f" : "#e8f0ff", 1.5, dpr);
    label(f >= 1000 ? (f / 1000).toFixed(1) + "k" : Math.round(f) + "", x + 6 * dpr, top, "#e8f0ff", dpr, 13); });
  const names = ["LOW", "MID", "HIGH"], cw = W / 3;
  bands.forEach((b, k) => {                                         /* each band: its scope and its meter */
    b.getFloatTimeDomainData(bb);
    let pk = 0; for (let i = 0; i < 1200; i++) pk = Math.max(pk, Math.abs(bb[i]));
    S.bpk = S.bpk || [0.05, 0.05, 0.05]; S.bpk[k] = Math.max(pk, S.bpk[k] * 0.97, 0.01);
    const x0 = k * cw + cw * 0.08, w = cw * 0.72, y = H * 0.74, A = H * 0.13, pts = [];
    for (let i = 0; i < 600; i++) pts.push([x0 + (i / 600) * w, y - bb[i * 2] / S.bpk[k] * A * 0.9]);
    glow(pts, BAND[k], 1.6, dpr);
    const lvl = Math.min(1, lv[k + 1] * 5), mx = x0 + w + cw * 0.06, mh = H * 0.3;
    g.fillStyle = "#0a1230"; g.fillRect(mx, y - mh / 2, cw * 0.06, mh);
    const q = g.createLinearGradient(0, y + mh / 2, 0, y - mh / 2); q.addColorStop(0, BAND[k]); q.addColorStop(1, "#ffffff");
    g.fillStyle = q; g.shadowBlur = 14 * dpr; g.shadowColor = BAND[k]; g.fillRect(mx, y + mh / 2 - lvl * mh, cw * 0.06, lvl * mh); g.shadowBlur = 0;
    label(names[k], x0, y - A - 14 * dpr, BAND[k], dpr, 15);
  });
}

/* ---- controls */
function setMode(m) { S.mode = m; localStorage.setItem("jmScopeMode", m); document.querySelectorAll("[data-m]").forEach((b) => b.classList.toggle("on", +b.dataset.m === m)); }
document.querySelectorAll("[data-m]").forEach((b) => b.addEventListener("click", () => setMode(+b.dataset.m)));
$("auto").addEventListener("click", () => { S.auto = !S.auto; S.autoT = performance.now(); $("auto").classList.toggle("on", S.auto); });
$("fs").addEventListener("click", () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}));
$("src").addEventListener("change", () => useSource($("src").value));
addEventListener("keydown", (e) => {
  if (e.key >= "1" && e.key <= "4") setMode(+e.key - 1);
  else if (e.key === "a" || e.key === "A") $("auto").click();
  else if (e.key === "f" || e.key === "F") $("fs").click();
});
let idle; const wake = () => { document.body.classList.remove("idle"); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add("idle"), 2500); };
addEventListener("mousemove", wake); wake();
cv.addEventListener("pointerdown", (e) => {
  if (!ac) { useSource($("src").value); return; }
  if (S.mode !== 3) return;
  const dpr = Math.min(2, devicePixelRatio || 1), x = e.clientX * dpr;
  const d = S.x.map((f) => Math.abs(fx(f, cv.width) - x)), i = d[0] < d[1] ? 0 : 1;
  if (d[i] < 40 * dpr) { S.drag = i; cv.setPointerCapture(e.pointerId); }
});
cv.addEventListener("pointermove", (e) => {
  if (S.drag < 0) return;
  const dpr = Math.min(2, devicePixelRatio || 1), f = xf(e.clientX * dpr, cv.width);
  S.x[S.drag] = S.drag === 0 ? Math.max(40, Math.min(S.x[1] / 1.5, f)) : Math.max(S.x[0] * 1.5, Math.min(16000, f));
  setCross();
});
cv.addEventListener("pointerup", () => { S.drag = -1; });
/* the editor's pages (ÉCRAN 2 in the editor): { type: "jm", pages: { title: { cut, res, ... } } } */
addEventListener("message", (e) => { if (e.data && e.data.type === "jm") S.pages = e.data.pages || {}; });
setMode(S.mode);
listInputs().then(() => { if ($("src").value === "demo") $("msg").textContent = "clique pour démarrer"; });
requestAnimationFrame(frame);
</script>
</body>
</html>
